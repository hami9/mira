name: 🐛 Bug report
description: Something is not working
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Please search the open issues first so this isn't a duplicate.
        You are welcome to write in Persian or English.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A full description of the problem plus the behaviour you expected
      placeholder: When I do ..., ... happens; I expected ... instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. The error ... appears
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Which part?
      options:
        - Operator dashboard
        - Chat widget
        - API / backend
        - Worker / AI
        - WordPress plugin
        - Installation / Debian package
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: 'Relevant output from: sudo mira logs api (strip any password/token!)'
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: 'e.g. Debian 12, Docker 27, installed from the deb package v1.0.0'
