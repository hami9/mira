name: ✨ Feature request
description: Suggest a new feature or an improvement
title: '[feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the feature from the angle of a real need, not just the solution
      placeholder: As an operator / shop owner, I want ... so that ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: If you have an implementation idea, write it here (optional)
  - type: dropdown
    id: component
    attributes:
      label: Which part?
      options:
        - Operator dashboard
        - Chat widget
        - API / backend
        - Worker / AI
        - WordPress plugin
        - Installation / Debian package
        - Other
