# CI میرا — با هر push و pull request اجرا می‌شود
name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  lint-and-build:
    name: Lint and build all workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      # ترتیب مهم است: shared-types باید قبل از بقیه build شود (اسکریپت ریشه رعایت می‌کند)
      - name: Build all workspaces
        run: npm run build

      - name: 'Widget size report (budget: 50KB gzip)'
        run: |
          SIZE=$(gzip -c apps/widget/dist/widget.js | wc -c)
          echo "Widget gzip size: ${SIZE} bytes"
          if [ "$SIZE" -gt 51200 ]; then
            echo "::error::Widget gzip size exceeded the 50KB budget"
            exit 1
          fi

      - name: Upload widget bundle
        uses: actions/upload-artifact@v4
        with:
          name: widget-dist
          path: apps/widget/dist/widget.js

  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: bash package/build-deb.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mira-deb
          path: package/dist/*.deb
