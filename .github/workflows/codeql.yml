# تحلیل ایستای امنیتی (SAST) — بند ۴ فاز ۱ نقشه‌راه.
# مخزن پابلیک است، پس CodeQL رایگان است. دو زبان واقعی پروژه اسکن می‌شوند:
# TypeScript (بک‌اند، داشبورد، ویجت) و PHP (افزونه‌ی ووکامرس).
name: CodeQL

on:
  push:
    branches: ['main']
  pull_request:
  schedule:
    # هفتگی، تا آسیب‌پذیری‌های تازه‌کشف‌شده روی کد بدون تغییر هم دیده شوند
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: 'Analyze: ${{ matrix.language }}'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'php']

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality

      # پروژه build مستقل ندارد که CodeQL لازم داشته باشد؛ هر دو زبان تفسیری‌اند
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: '/language:${{ matrix.language }}'
