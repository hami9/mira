# انتشار ایمیج‌های Docker میرا در GitHub Container Registry ‏(ghcr.io)
# اجرا: با هر push به main (تگ latest)، با هر tag نسخه v* (تگ semver)، یا دستی.
# پکیج‌ها خودکار به همین ریپو لینک می‌شوند (label ‏org.opencontainers.image.source).
name: Docker Publish

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: 'Build and publish: ${{ matrix.image }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mira-api
            dockerfile: apps/api/Dockerfile
          - image: mira-worker
            dockerfile: apps/worker/Dockerfile
          - image: mira-dashboard
            dockerfile: apps/dashboard/Dockerfile.prod
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Mira self-hosted live chat — ${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
