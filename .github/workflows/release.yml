# انتشار نسخه — با push هر tag نسخه (v1.0.0، v1.1.0، ...) خودکار اجرا می‌شود:
#   یادداشت انتشار از بخش همان نسخه در CHANGELOG.md خوانده می‌شود و
#   پکیج دبیان + zip افزونه‌ی وردپرس ساخته و پیوست می‌شوند.
# با اجرای دستی (workflow_dispatch) هم می‌توان برای یک tag موجود ریلیز ساخت/بازسازی کرد —
# مثلاً برای نسخه‌های قدیمی که هنوز اسکریپت ساخت پکیج را نداشتند (attach_artifacts=false).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.0) — must already exist in the repository'
        required: true
        type: string
      attach_artifacts:
        description: 'Build and attach the deb package and the WordPress plugin zip'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      # یادداشت انتشار = بخش همین نسخه از CHANGELOG.md (تا تیتر نسخه‌ی بعدی)
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION='${{ steps.version.outputs.number }}'
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section for version $VERSION found in CHANGELOG.md" >&2
            exit 1
          fi
          cat >> release-notes.md <<'EOF'

          ---

          ## Install on a Debian/Ubuntu server

          ```bash
          sudo dpkg -i mira_*_all.deb || sudo apt -f install
          sudo mira setup && sudo mira start
          ```

          Full guide (all distributions, WordPress, troubleshooting):
          [`package/INSTALL.md`](https://github.com/hami9/mira/blob/main/package/INSTALL.md)
          — also available in Persian:
          [`package/INSTALL.fa.md`](https://github.com/hami9/mira/blob/main/package/INSTALL.fa.md)

          WordPress plugin: install `mira-wordpress-plugin.zip` from the WordPress admin.

          ## Docker images

          ```
          ghcr.io/hami9/mira-api
          ghcr.io/hami9/mira-worker
          ghcr.io/hami9/mira-dashboard
          ```
          EOF

      - name: Build Debian package
        if: github.event_name == 'push' || inputs.attach_artifacts
        run: bash package/build-deb.sh

      - name: Build WordPress plugin zip
        if: github.event_name == 'push' || inputs.attach_artifacts
        run: |
          cd wordpress-plugin
          zip -r ../package/dist/mira-wordpress-plugin.zip mira

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Mira ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          # اگر artifactها ساخته نشده باشند، glob خالی می‌ماند و بی‌صدا رد می‌شود
          files: |
            package/dist/*.deb
            package/dist/mira-wordpress-plugin.zip
