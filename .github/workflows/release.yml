# انتشار نسخه — با push هر tag نسخه (v1.0.0، v1.1.0، ...) اجرا می‌شود:
#   پکیج دبیان + zip افزونه‌ی وردپرس ساخته و به GitHub Release پیوست می‌شوند.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: ساخت و انتشار
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ساخت پکیج دبیان
        run: bash package/build-deb.sh

      - name: ساخت zip افزونه‌ی وردپرس
        run: |
          cd wordpress-plugin
          zip -r ../package/dist/mira-wordpress-plugin.zip mira

      - name: انتشار GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            package/dist/*.deb
            package/dist/mira-wordpress-plugin.zip
          body: |
            ## نصب روی سرور دبیان/اوبونتو

            ```bash
            sudo dpkg -i mira_*_all.deb || sudo apt -f install
            sudo mira setup && sudo mira start
            ```

            راهنمای کامل: [`package/INSTALL.fa.md`](https://github.com/hami9/mira/blob/main/package/INSTALL.fa.md)

            افزونه‌ی وردپرس: فایل `mira-wordpress-plugin.zip` را از پیشخوان وردپرس نصب کنید.
