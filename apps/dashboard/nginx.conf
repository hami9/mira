# سرو استاتیک داشبورد میرا (SPA) — پشت Caddy، فقط داخل شبکه‌ی داکر
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # فایل‌های باندل‌شده hash در نام دارند — کش بلندمدت امن است
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — هر مسیر ناشناخته به index.html می‌رسد
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
