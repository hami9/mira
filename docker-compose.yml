name: mira

services:
  # پایگاه‌داده اصلی — با افزونه pgvector برای embedding پایگاه دانش (فاز ۴)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mira_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # کش/presence/صف BullMQ
  redis:
    image: redis:7-alpine
    container_name: mira_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ذخیره فایل S3-compatible برای پیوست‌ها (در production قابل تغییر به هر S3 دیگه)
  minio:
    image: minio/minio:latest
    container_name: mira_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # کنسول وب MinIO
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # بک‌اند NestJS + Socket.io gateway
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mira_api
    restart: unless-stopped
    env_file: .env
    environment:
      API_PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # پردازشگرهای BullMQ برای هوش مصنوعی (فاز ۴): پایگاه دانش، ربات پاسخ‌گو، Copilot، خلاصه‌سازی
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: mira_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # داشبورد اپراتور/ادمین (React + Vite)
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: mira_dashboard
    restart: unless-stopped
    environment:
      VITE_API_URL: ${PUBLIC_API_URL}
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
