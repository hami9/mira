<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 200" role="img" aria-label="نشان انیمیشنی میرا">
  <!-- نسخه‌ی انیمیشنی نشان میرا: ترسیم حلقه‌ی حباب‌ها، ظاهر شدن قلب با پرش، تپش دوره‌ای و شناوری ملایم -->
  <defs>
    <linearGradient id="miraBlueA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5F9DF3" />
      <stop offset="1" stop-color="#2455C4" />
    </linearGradient>
    <linearGradient id="miraTealA" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ECDBB" />
      <stop offset="0.55" stop-color="#17B8A6" />
      <stop offset="1" stop-color="#2E6BE6" />
    </linearGradient>
    <linearGradient id="miraHeartA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2E6BE6" />
      <stop offset="0.55" stop-color="#17B8A6" />
      <stop offset="1" stop-color="#F5A623" />
    </linearGradient>
  </defs>

  <style>
    .mira-ring {
      stroke-dasharray: 352;
      stroke-dashoffset: 352;
      animation: mira-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    .mira-ring--teal { animation-delay: 0.15s; }
    .mira-tail {
      opacity: 0;
      animation: mira-fade 0.5s ease-out 0.9s forwards;
    }
    .mira-bubble--blue { animation: mira-float 4s ease-in-out 1.6s infinite; }
    .mira-bubble--teal { animation: mira-float 4s ease-in-out 2.6s infinite; }
    .mira-heart {
      transform-origin: 128px 100px;
      transform: scale(0);
      animation:
        mira-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 1s forwards,
        mira-beat 2.6s ease-in-out 1.8s infinite;
    }
    @keyframes mira-draw { to { stroke-dashoffset: 0; } }
    @keyframes mira-fade { to { opacity: 1; } }
    @keyframes mira-pop { to { transform: scale(1); } }
    @keyframes mira-beat {
      0%, 28%, 100% { transform: scale(1); }
      8% { transform: scale(1.08); }
      16% { transform: scale(0.98); }
    }
    @keyframes mira-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mira-ring { stroke-dashoffset: 0; animation: none; }
      .mira-tail { opacity: 1; animation: none; }
      .mira-heart { transform: scale(1); animation: none; }
      .mira-bubble--blue, .mira-bubble--teal { animation: none; }
    }
  </style>

  <!-- حباب راست (فیروزه‌ای) -->
  <g class="mira-bubble--teal">
    <path class="mira-tail" d="M200 141 C 208 156, 214 166, 224 175 C 206 173, 190 166, 178 155 Z" fill="#0F9887" />
    <circle class="mira-ring mira-ring--teal" cx="164" cy="94" r="56" fill="none" stroke="url(#miraTealA)" stroke-width="26" />
  </g>

  <!-- حباب چپ (آبی) -->
  <g class="mira-bubble--blue">
    <path class="mira-tail" d="M56 141 C 48 156, 42 166, 32 175 C 50 173, 66 166, 78 155 Z" fill="#2455C4" />
    <circle class="mira-ring" cx="92" cy="94" r="56" fill="none" stroke="url(#miraBlueA)" stroke-width="26" />
  </g>

  <!-- قلب میانی -->
  <path class="mira-heart"
    d="M128 142 C 105 124, 91 108, 91 89 C 91 74, 103 65, 115 67 C 121 68, 126 72, 128 78 C 130 72, 135 68, 141 67 C 153 65, 165 74, 165 89 C 165 108, 151 124, 128 142 Z"
    fill="#FFFFFF" stroke="url(#miraHeartA)" stroke-width="11" stroke-linejoin="round" />
</svg>
